name: AgentRouter
api_style: openai
auth:
  type: bearer
  header: Authorization
  prefix: "Bearer "
  env_var: AGENTROUTER_API_KEY
  doc_url: https://agentrouter.org/docs/opencode.html
pricing:
  free: false
  pay_as_you_go: true
  doc_url: https://agentrouter.org/docs/opencode.html
  free_basis: kein $0-Modell in models.dev
supports:
  - chat
  - vision
  - tools
  - json_mode
  - streaming
  - reasoning
endpoint: https://agentrouter.org/v1
notes:
  source: generiert aus https://models.dev/api.json
  model_catalog_size: 3
  kuratiert: auth/pricing/supports aus Mirror-Feldern abgeleitet
models:
  - id: gpt-5.6-sol
    family: gpt-sol
    context_window: 1050000
    tags: [reasoning, tools, json_mode, vision, multimodal]
  - id: claude-opus-5
    family: claude-opus
    context_window: 1000000
    tags: [reasoning, tools, vision, multimodal]
  - id: claude-opus-4-8
    family: claude-opus
    context_window: 1000000
    tags: [reasoning, tools, vision, multimodal]
