name: Infomaniak
api_style: openai
auth:
  type: bearer
  header: Authorization
  prefix: "Bearer "
  env_var: INFOMANIAK_API_KEY
  doc_url: https://www.infomaniak.com/en/hosting/ai-services/open-source-models
pricing:
  free: true
  pay_as_you_go: true
  doc_url: https://www.infomaniak.com/en/hosting/ai-services/open-source-models
  free_basis: hat $0-Modelle in models.dev
supports:
  - chat
  - vision
  - audio
  - tools
  - json_mode
  - streaming
  - reasoning
endpoint: https://api.infomaniak.com/2/ai/${INFOMANIAK_PRODUCT_ID}/openai/v1
notes:
  source: generiert aus https://models.dev/api.json
  model_catalog_size: 10
  kuratiert: auth/pricing/supports aus Mirror-Feldern abgeleitet
models:
  - id: bge_multilingual_gemma2
    family: text-embedding
    context_window: 8000
    pricing:
      input: 0.08
      output: 0.0
    tags: [open_weights]
  - id: mini_lm_l12_v2
    family: text-embedding
    context_window: 128
    pricing:
      input: 0.0
      output: 0.0
